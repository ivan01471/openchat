services:
  openchat:
    build: .
    container_name: openchat
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - LIMIT_MIN_AGE=16
      - LIMIT_CONN_PER_IP=30
      - LIMIT_JOIN_PER_MIN=30
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
